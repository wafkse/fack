[package]
name = "fack-macro"
version = "0.4.0"
edition = "2024"
description = "Procedural macro implementation for fack error handling"
license = "GPL-3.0"
repository = "https://github.com/wafkse/fack"
homepage = "https://github.com/wafkse/fack"
documentation = "https://docs.rs/fack-macro"
keywords = ["error", "derive", "macro", "no-std"]
categories = ["development-tools::procedural-macro-helpers", "no-std"]
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
fack-codegen.workspace = true
syn = { workspace = true, features = ["proc-macro"] }

[lints]
workspace = true
